    <script type="text/javascript">
      
    let radio1 = document.getElementById('first'), radio2 = document.getElementById('second'), radio3
    =document.getElementById('third');

     var select_box = document.getElementsByClassName('box'), show_hide_box= document.getElementsByClassName('show-hide');

     function check(src) {
        if (radio1.checked) {
          for(var i=0; i< select_box.length; i++){
              select_box[i].classList.remove("active");
          }
          src.closest(".box").classList.add("active");

          for(var i=0; i< show_hide_box.length; i++){
            show_hide_box[i].classList.remove("d-flex");
            show_hide_box[i].classList.remove("d-none");
            show_hide_box[i].classList.add("d-none");
          }
          src.closest(".box").querySelector('.show-hide').classList.remove("d-none");
          src.closest(".box").querySelector('.show-hide').classList.add("d-flex");
        }
